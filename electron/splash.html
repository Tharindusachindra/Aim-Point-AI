<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AimPointAI - Launching</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070A12;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      border: 1px solid rgba(0, 245, 212, 0.3);
      border-radius: 16px;
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
    }
    .logo-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #00F5D4;
      border-right-color: #00BBF9;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #00F5D4, #00BBF9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 11px;
      color: #94A3B8;
      font-family: monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .status {
      font-size: 12px;
      color: #38BDF8;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00F5D4;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-ring"></div>
  </div>
  <h1 class="title">AimPointAI Desktop</h1>
  <p class="subtitle">Real-Time Basketball Kinematics & Mistake Remediation</p>
  <div class="status">
    <div class="status-dot"></div>
    <span id="statusText">Initializing AI & Kinematics Engine...</span>
  </div>
</body>
</html>
